# 店舗注文システムのパラメータ
# aruco_dictionary は番号札の印刷（make_marker_cards --dict）と同じにする

shop_server:
  ros__parameters:
    host: "0.0.0.0"          # 同じ Wi-Fi のタブレットから開けるよう全IFで待ち受け
    port: 8000
    products_file: "~/.shop_robot/products.json"
    state_file: "~/.shop_robot/queue_state.json"   # 再起動しても待ち行列を復元
    aruco_dictionary: "DICT_4X4_1000"   # 注文番号 0〜999（番号札の印刷もこの辞書で）
    camera_device: 0         # /dev/video0 を直接開く。-1 なら image_topic を購読（ロボットのカメラを使う場合）
    image_topic: "/image_raw"
    frame_rate: 15.0
    camera_width: 640
    camera_height: 480
    min_frames: 5            # 連続して見えたフレーム数で確定（誤検出防止）
    cooldown_sec: 3.0        # 同じ番号を再判定しない時間
    preview_mirror: true     # 画面のカメラ映像を鏡像にする（検出には影響しない）

prepare_stub:
  ros__parameters:
    seconds_per_item: 3.0
    fail_product_id: -1      # この商品IDで失敗させる（失敗時の流れの確認用）

handover:
  ros__parameters:
    motion_file: ""          # 空なら shop_robot/config/handover.yaml（実機用に別ファイルを指定してよい）

mock_robot:
  ros__parameters:
    motion_file: ""          # handover と同じファイルにする
    delay: 1.0               # 各動作の完了を返すまでの秒数（handover.yaml の mock_delay が優先）
    fail_motion: ""          # この動作名には応答しない（例 grasp: つかみ失敗の流れの確認）
