<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>呼び出し表示</title>
<style>
  /* 色はキャラクター画像から取った値。--red は char.png の背景色と同じにしておくこと（継ぎ目が出ないように） */
  :root {
    --red: #B94047; --maroon: #7E2931; --cream: #FFF8EE; --toast: #DCA85B; --line: #EBD9C6; --muted: #A5676C;
    --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font); font-variant-numeric: tabular-nums; overflow: hidden; height: 100vh;
    display: grid; grid-template-columns: 38vw 1fr; background: var(--cream);
  }

  /* ---- 左: キャラクター・吹き出し・カメラ ---- */
  .left {
    background: var(--red); color: var(--cream); display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 2vw 2.4vw; gap: 1.4vw; min-height: 0;
  }
  .bubble {
    position: relative; background: var(--cream); color: var(--red); border-radius: 2vw; padding: 1.3vw 2vw;
    font-size: 2vw; font-weight: 900; text-align: center; line-height: 1.45; max-width: 100%; text-wrap: balance;
    transition: transform .2s;
  }
  .bubble::after {
    content: ""; position: absolute; left: 22%; bottom: -1.4vw;
    border: 1.4vw solid transparent; border-top-color: var(--cream); border-bottom: 0;
  }
  .bubble.say { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
  .char { height: 27vh; flex: none; }
  .char img { height: 100%; display: block; }
  body.no-cam .char { height: 46vh; }
  .cam { width: 100%; background: var(--maroon); border-radius: 1.6vw; padding: 1vw; }
  .cam[hidden] { display: none; }
  .cam { width: auto; max-width: 100%; }
  .cam img { height: 27vh; width: auto; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 1vw; display: block; margin: 0 auto; }
  .cam p { margin: .6vw 0 0; text-align: center; font-size: 1.3vw; font-weight: 700; }

  /* ---- 右: お呼び出し中の番号（1行に1件のチケット） ---- */
  .right { color: var(--maroon); padding: 2.2vw 3vw; display: flex; flex-direction: column; gap: 1.4vw; min-height: 0; }
  .right h1 { margin: 0; font-size: 2.6vw; letter-spacing: .14em; color: var(--red); display: flex; align-items: center; gap: 1vw; }
  .right h1::before { content: ""; width: 1.2vw; height: 1.2vw; border-radius: 50%; background: var(--red); }
  .right h1.calling::before { animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .tickets { flex: 1; min-height: 0; display: grid; gap: 1.4vw; align-content: start; --no: 6.6vw; --msg: 2.2vw; --nowidth: 20vw; }
  .tickets.s5 { --no: 5vw; --msg: 1.8vw; --nowidth: 16vw; gap: 1vw; }
  .tickets.s7 { grid-template-columns: 1fr 1fr; --no: 4.4vw; --msg: 1.25vw; --nowidth: 11vw; gap: 1vw; }
  .tickets.s7 .ticket .msg { padding: 0 1.2vw; }
  .tickets.s7 .ticket.new { box-shadow: 0 0 0 .25vw var(--toast); animation: none; }
  .tickets.s7 .ticket.new .msg::after { display: none; }   /* 2列のときは枠の色だけで示す */
  .tickets.s13 { grid-template-columns: repeat(4, 1fr); --no: 3.8vw; --nowidth: 100%; gap: .9vw; }   /* 13件以上は番号だけ */
  .tickets.s13 .ticket .msg { display: none; }
  .tickets.s13 .ticket.new { box-shadow: 0 0 0 .25vw var(--toast); animation: none; }
  .ticket { display: flex; align-items: stretch; background: #fff; border: .25vw solid var(--line); border-radius: 1.6vw; overflow: hidden; }
  .ticket .no {
    background: var(--red); color: var(--cream); width: var(--nowidth); flex: none; padding: .4vw 0;
    display: flex; align-items: baseline; justify-content: center; gap: .5vw;
  }
  .ticket .no b { font-size: var(--no); font-weight: 900; line-height: 1.05; }
  .ticket .no span { font-size: calc(var(--no) * .36); font-weight: 900; }
  .ticket .msg {
    flex: 1; padding: 0 2vw; font-size: var(--msg); font-weight: 800; border-left: .3vw dashed var(--line);
    display: flex; align-items: center; gap: 1vw; white-space: nowrap; overflow: hidden;
  }
  .ticket.new { border-color: var(--toast); box-shadow: 0 0 0 .4vw var(--toast); animation: glow 1s ease-in-out 6; }
  @keyframes glow { 50% { box-shadow: 0 0 0 .9vw rgba(220,168,91,.35); } }
  .ticket.new .msg::after {
    content: "NEW"; margin-left: auto; background: var(--toast); color: var(--maroon); border-radius: .6vw;
    padding: .2vw .8vw; font-size: calc(var(--msg) * .64);
  }

  .idle { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1.2vw; }
  .idle .big { font-size: 3.6vw; font-weight: 900; color: var(--red); }
  .idle .sub { font-size: 2vw; font-weight: 700; line-height: 1.6; }

  .foot { display: grid; grid-template-columns: 1fr auto; gap: 1.6vw; }
  .panel { background: #fff; border: .2vw solid var(--line); border-radius: 1.4vw; padding: 1vw 1.4vw; min-width: 0; }
  .panel h2 { margin: 0 0 .6vw; font-size: 1.4vw; letter-spacing: .12em; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: .7vw; max-height: 7.4vw; overflow: hidden; }
  .chip { border: .2vw solid var(--maroon); border-radius: 99px; padding: .05vw 1vw; font-size: 2vw; font-weight: 900; }
  .chip small { font-size: 1vw; margin-left: .2vw; }
  .chip.busy { background: var(--toast); border-color: var(--toast); }
  .none { font-size: 1.8vw; color: var(--muted); }

  .offline { position: fixed; top: 1vw; right: 1vw; background: var(--maroon); color: #fff; padding: .6vw 1.2vw; border-radius: .8vw; font-size: 1.4vw; font-weight: 800; }
  #sound { position: fixed; left: 1vw; bottom: 1vw; border: 0; background: rgba(255,248,238,.18); color: var(--cream); font: inherit; font-size: 1.1vw; padding: .5vw 1vw; border-radius: .6vw; cursor: pointer; }
</style>
</head>
<body>
  <div class="left">
    <div class="bubble" id="bubble">呼ばれたら<br>番号札をカメラにかざしてね！</div>
    <div class="char"><img src="/static/char.png" alt=""></div>
    <div class="cam" id="cambox" hidden><img id="camimg" alt=""><p>↑ 枠が緑になれば受付OK</p></div>
  </div>
  <div class="right">
    <h1 id="title">お呼び出し中</h1>
    <div class="tickets" id="tickets"></div>
    <div class="foot">
      <div class="panel"><h2>準備中の番号</h2><div class="chips" id="pending"></div></div>
      <div class="panel"><h2>ロボット対応中</h2><div class="chips" id="robot"></div></div>
    </div>
  </div>
  <div class="offline" id="offline" hidden>ロボット未接続</div>
  <button id="sound">クリックで呼び出し音を有効にする</button>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const chip = (n, cls = "") => `<span class="chip ${cls}">${n}<small>番</small></span>`;

// ---- 呼び出し音（ブラウザの制約で、一度画面をクリックしないと鳴らせない）
let audio = null;
document.addEventListener("click", () => {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  $("#sound").hidden = true;
});
function chime() {
  if (!audio) return;
  const t = audio.currentTime;
  [[880, 0], [660, 0.35]].forEach(([f, d]) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + d);
    g.gain.exponentialRampToValueAtTime(0.4, t + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.6);
    o.connect(g).connect(audio.destination);
    o.start(t + d); o.stop(t + d + 0.65);
  });
}

// ---- カメラ（/display?camera=0 で非表示）
const camEnabled = new URLSearchParams(location.search).get("camera") !== "0";
let camStreaming = false;
function renderCamera(available) {
  const want = camEnabled && available;
  if (want && !camStreaming) $("#camimg").src = "/api/camera.mjpg?t=" + Date.now();
  if (!want && camStreaming) $("#camimg").removeAttribute("src");
  camStreaming = want;
  $("#cambox").hidden = !want;
  document.body.classList.toggle("no-cam", !want);
}
$("#camimg").addEventListener("error", () => { camStreaming = false; });

// ---- 吹き出し（ふだんは案内。お客様向けメッセージが来たら8秒だけ表示）
let bubbleDefault = "", sayUntil = 0, sayTimer;
function setBubble(text) {
  bubbleDefault = text;
  if (Date.now() >= sayUntil) $("#bubble").innerHTML = text;
}
function say(text) {
  const b = $("#bubble");
  b.textContent = text;
  b.classList.remove("say"); void b.offsetWidth; b.classList.add("say");
  sayUntil = Date.now() + 8000;
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => { sayUntil = 0; b.innerHTML = bubbleDefault; }, 8000);
}
let lastSeq = null;
function showEvent(text, seq) {
  if (seq === lastSeq) return;
  const first = lastSeq === null;
  lastSeq = seq;
  if (!first && text) say(text);   // 開いた直後に古いメッセージを出さない
}

// ---- 表示
let last = "", known = null;
const newUntil = new Map();   // 番号 -> 強調をやめる時刻

function render(st) {
  renderCamera(!!(st && st.camera));
  $("#offline").hidden = !!(st && st.connected);
  const q = st && st.queue;
  const key = JSON.stringify(q && { ...q, progress: 0, progress_text: "" });
  if (key === last) return;
  last = key;
  if (!q) {
    $("#title").className = "";
    $("#tickets").className = "tickets";
    $("#tickets").innerHTML = `<div class="idle"><div class="big">準備中です</div></div>`;
    return;
  }

  // 新しく呼び出された番号
  const nums = q.ready.map((o) => o.order_number);
  if (known) {
    const fresh = nums.filter((n) => !known.has(n));
    fresh.forEach((n) => newUntil.set(n, Date.now() + 6000));
    if (fresh.length) chime();
  }
  known = new Set(nums);

  const tk = $("#tickets");
  if (nums.length) {
    $("#title").className = "calling";
    $("#title").textContent = "お呼び出し中";
    tk.className = "tickets" + (nums.length > 12 ? " s13" : nums.length > 6 ? " s7" : nums.length > 4 ? " s5" : "");
    // 新しく呼んだ番号を上に（1行に1件なので「1」「2」と「12」を取り違えない）
    tk.innerHTML = [...nums].reverse().map((n) => `
      <div class="ticket ${(newUntil.get(n) || 0) > Date.now() ? "new" : ""}">
        <div class="no"><b>${n}</b><span>番</span></div>
        <div class="msg">お受け取りください</div>
      </div>`).join("");
    setBubble("呼ばれたら<br>番号札をカメラにかざしてね！");
  } else if (q.pending.length || q.active) {
    $("#title").className = "";
    $("#title").textContent = "お呼び出し";
    tk.className = "tickets";
    tk.innerHTML = `<div class="idle"><div class="big">ただいま準備中です</div>
      <div class="sub">できあがったら、ここに番号が出ます。<br>番号札を持ってお待ちください。</div></div>`;
    setBubble("いまつくってるよ！<br>もう少し待っててね");
  } else {
    $("#title").className = "";
    $("#title").textContent = "いらっしゃいませ";
    tk.className = "tickets";
    tk.innerHTML = `<div class="idle"><div class="big">ご注文は受付でどうぞ</div>
      <div class="sub">番号札をお渡しします。<br>できあがったらこの画面でお呼びします。</div></div>`;
    setBubble("いらっしゃいませ！");
  }

  $("#pending").innerHTML = q.pending.length ? q.pending.map((o) => chip(o.order_number)).join("") : `<span class="none">—</span>`;
  $("#robot").innerHTML = q.active ? chip(q.active.order_number, "busy") : `<span class="none">—</span>`;
  showEvent(q.public_message, q.public_seq);
}

async function poll() {
  try { render(await (await fetch("/api/status")).json()); } catch { render(null); }
}
poll();
setInterval(poll, 1000);
// 強調の終了を反映
setInterval(() => {
  const now = Date.now();
  if ([...newUntil.values()].some((t) => t < now)) {
    last = "";
    for (const [n, t] of newUntil) if (t < now) newUntil.delete(n);
  }
}, 1000);
</script>
</body>
</html>
