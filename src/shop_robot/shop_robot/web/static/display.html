<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>呼び出し表示</title>
<style>
  :root {
    --bg: #18202e; --panel: #222c3d; --ink: #f4efe4; --muted: #9aa3b4;
    --accent: #f0603f; --ok: #5cc98a; --indigo: #7da2d6;
    --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden;
    font-variant-numeric: tabular-nums;
    display: grid; grid-template-columns: 1.7fr 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 2vw; padding: 2vw;
  }
  .main {
    background: var(--panel); border-radius: 2vw; padding: 2.5vw 3vw; display: flex; flex-direction: column;
    align-items: center; text-align: center; position: relative; overflow: hidden; min-height: 0;
  }
  .main.calling { border: .5vw solid var(--accent); }
  .label { font-size: 2.6vw; font-weight: 800; letter-spacing: .15em; color: var(--muted); }
  .main.calling .label { color: var(--accent); }
  .called {
    flex: 1; min-height: 0; width: 100%; display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    gap: 1vw 4vw;
  }
  .called span { font-weight: 900; line-height: 1.05; color: var(--ink); }
  .called span.new { color: var(--accent); animation: flash 1s ease-in-out 6; }
  @keyframes flash { 50% { opacity: .25; } }
  .msg { font-size: 2.4vw; font-weight: 700; line-height: 1.5; }
  .idle { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2vw; }
  .marker-hint { display: flex; align-items: center; gap: 1.5vw; font-size: 2.3vw; font-weight: 700; text-align: left; line-height: 1.4; }
  .marker-hint .mk { width: 5vw; height: 5vw; background: #fff; padding: .5vw; border-radius: .5vw; flex: none; }

  .side { display: flex; flex-direction: column; gap: 2vw; min-height: 0; }
  .box { background: var(--panel); border-radius: 2vw; padding: 2vw; min-height: 0; }
  .box h2 { margin: 0 0 1.2vw; font-size: 2vw; letter-spacing: .12em; color: var(--muted); }
  .box.pending { flex: 1; overflow: hidden; }
  .box.cam { padding: 1.2vw; flex: none; }
  .box.cam h2 { margin-bottom: .8vw; font-size: 1.5vw; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cam-view { aspect-ratio: 4 / 3; max-height: 38vh; margin: 0 auto; background: #111723; border-radius: 1.2vw; overflow: hidden; }
  body.with-cam .box.robot { padding: 1.4vw 2vw; }
  body.with-cam .box.robot h2 { margin-bottom: .6vw; }
  body.with-cam .robot .num { font-size: 4.5vw; }
  body.with-cam .side { gap: 1.2vw; }
  body.with-cam .box.pending { padding: 1.4vw 2vw; }
  body.with-cam .box.pending h2 { margin-bottom: .6vw; }
  body.with-cam .nums span { font-size: 2.8vw; min-width: 5.5vw; }
  .cam-view img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .box.cam[hidden] { display: none; }
  .robot .num { font-size: 6vw; font-weight: 900; color: var(--indigo); line-height: 1; }
  .robot .num small { font-size: 2.2vw; color: var(--ink); margin-left: .4vw; }
  .bar { height: 1vw; border-radius: .5vw; background: rgba(255,255,255,.12); margin-top: 1.2vw; overflow: hidden; }
  .bar > div { height: 100%; background: var(--indigo); transition: width .5s; }
  .nums { display: flex; flex-wrap: wrap; gap: 1vw; }
  .nums span { font-size: 3.6vw; font-weight: 900; min-width: 7vw; text-align: center; padding: .3vw 1vw; border-radius: 1vw; background: rgba(255,255,255,.06); }
  .none { font-size: 2vw; color: var(--muted); }
  .event { grid-column: 1 / -1; font-size: 2.4vw; font-weight: 800; text-align: center; min-height: 3.4vw; }
  .offline { position: fixed; top: 1vw; right: 1vw; background: var(--accent); color: #fff; padding: .6vw 1.2vw; border-radius: .8vw; font-size: 1.4vw; font-weight: 800; }
  #sound { position: fixed; left: 1vw; bottom: 1vw; border: 0; background: rgba(255,255,255,.1); color: var(--muted); font: inherit; font-size: 1.2vw; padding: .5vw 1vw; border-radius: .6vw; cursor: pointer; }
</style>
</head>
<body>
  <div class="main" id="main"></div>
  <div class="side">
    <div class="box cam" id="cambox" hidden><h2>番号札をカメラに映してください</h2><div class="cam-view"><img id="camimg" alt=""></div></div>
    <div class="box robot"><h2>ロボット対応中</h2><div id="robot"></div></div>
    <div class="box pending"><h2>準備中の番号</h2><div class="nums" id="pending"></div></div>
  </div>
  <div class="event" id="event"></div>
  <div class="offline" id="offline" hidden>ロボット未接続</div>
  <button id="sound">クリックで呼び出し音を有効にする</button>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const mk = `<svg class="mk" viewBox="0 0 6 6" shape-rendering="crispEdges"><rect width="6" height="6"/><rect x="1" y="1" width="1" height="1" fill="#fff"/><rect x="3" y="1" width="2" height="1" fill="#fff"/><rect x="2" y="2" width="1" height="2" fill="#fff"/><rect x="4" y="3" width="1" height="1" fill="#fff"/><rect x="1" y="4" width="2" height="1" fill="#fff"/></svg>`;

// ---- 呼び出し音（ブラウザの制約で、一度画面をクリックしないと鳴らせない）
let audio = null;
document.addEventListener("click", () => {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  $("#sound").hidden = true;
});
function chime() {
  if (!audio) return;
  const t = audio.currentTime;
  [[880, 0], [660, 0.35]].forEach(([f, d]) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + d);
    g.gain.exponentialRampToValueAtTime(0.4, t + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.6);
    o.connect(g).connect(audio.destination);
    o.start(t + d); o.stop(t + d + 0.65);
  });
}

// ---- 表示
let last = "", known = null;
const newUntil = new Map();   // 番号 -> 点滅をやめる時刻

function numSize(count) {
  if (count <= 1) return "20vw";
  if (count <= 2) return "15vw";
  if (count <= 4) return "11vw";
  if (count <= 8) return "7.5vw";
  return "5.5vw";
}

// ---- カメラ（/display?camera=0 で非表示）
const camEnabled = new URLSearchParams(location.search).get("camera") !== "0";
let camStreaming = false;
function renderCamera(available) {
  const want = camEnabled && available;
  if (want && !camStreaming) $("#camimg").src = "/api/camera.mjpg?t=" + Date.now();
  if (!want && camStreaming) $("#camimg").removeAttribute("src");
  camStreaming = want;
  $("#cambox").hidden = !want;
  document.body.classList.toggle("with-cam", want);
}
$("#camimg").addEventListener("error", () => { camStreaming = false; });

function render(st) {
  renderCamera(!!(st && st.camera));
  $("#offline").hidden = !!(st && st.connected);
  const q = st && st.queue;
  const key = JSON.stringify(q && { ...q, progress_text: "" });
  if (key === last) return;
  last = key;
  const main = $("#main");
  if (!q) { main.className = "main"; main.innerHTML = `<div class="idle msg">準備中です</div>`; return; }

  // 新しく呼び出された番号
  const nums = q.ready.map((o) => o.order_number);
  if (known) {
    const fresh = nums.filter((n) => !known.has(n));
    fresh.forEach((n) => newUntil.set(n, Date.now() + 6000));
    if (fresh.length) chime();
  }
  known = new Set(nums);

  if (nums.length) {
    main.className = "main calling";
    main.innerHTML = `<div class="label">お呼び出し中</div>
      <div class="called" style="font-size:${numSize(nums.length)}">
        ${nums.map((n) => `<span class="${(newUntil.get(n) || 0) > Date.now() ? "new" : ""}">${n}</span>`).join("")}
      </div>
      <div class="marker-hint">${mk}<span>番号札のマーカーを<br>カメラにかざしてください</span></div>`;
  } else if (q.pending.length || q.active) {
    main.className = "main";
    main.innerHTML = `<div class="label">お呼び出し</div>
      <div class="idle"><div class="msg">ご注文の品を準備しています<br>番号が表示されるまでお待ちください</div></div>`;
  } else {
    main.className = "main";
    main.innerHTML = `<div class="label">いらっしゃいませ</div><div class="idle"><div class="msg">ご注文は受付でどうぞ</div></div>`;
  }

  $("#robot").innerHTML = q.active
    ? `<div class="num">${q.active.order_number}<small>番</small></div><div class="bar"><div style="width:${Math.round(q.progress * 100)}%"></div></div>`
    : `<div class="none">—</div>`;
  $("#pending").innerHTML = q.pending.length
    ? q.pending.map((o) => `<span>${o.order_number}</span>`).join("") : `<div class="none">—</div>`;
  showEvent(q.public_message, q.public_seq);
}

let lastSeq = null, eventTimer;
function showEvent(text, seq) {
  if (seq === lastSeq) return;
  const first = lastSeq === null;
  lastSeq = seq;
  if (first || !text) return;   // 開いた直後に古いメッセージを出さない
  $("#event").textContent = text;
  clearTimeout(eventTimer);
  eventTimer = setTimeout(() => ($("#event").textContent = ""), 8000);
}

async function poll() {
  try { render(await (await fetch("/api/status")).json()); } catch { render(null); }
}
poll();
setInterval(poll, 1000);
// 点滅の終了を反映
setInterval(() => { if ([...newUntil.values()].some((t) => t < Date.now())) { last = ""; for (const [n, t] of newUntil) if (t < Date.now()) newUntil.delete(n); } }, 1000);
</script>
</body>
</html>
